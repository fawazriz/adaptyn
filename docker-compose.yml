services:
  client:
    build: 
      context: ./client
      dockerfile: dockerfile
      target: development
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.local
  server:
    build: 
      context: ./server
      dockerfile: dockerfile
      target: development
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env