name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  client:
    name: Client Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: &checkout actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: &setup-node actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint

      - name: Type-check client
        run: ./node_modules/.bin/tsc --noEmit

      - name: Test client
        run: npm run test

  server:
    name: Server Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: *checkout

      - name: Set up Node.js
        uses: *setup-node
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint server
        run: npm run lint

      - name: Test server
        run: npm run test

  docker:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: [client, server]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: *checkout

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Prepare registry owner
        id: registry
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each Dockerfile runs the production application build. Build once here;
      # publish that build only on a push to main, including a merged PR.
      - name: Build client image and publish on main
        uses: &build-push docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./client
          file: ./client/dockerfile
          target: production
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/adaptyn-client:sha-${{ github.sha }}
          cache-from: type=gha,scope=adaptyn-client
          cache-to: type=gha,mode=max,scope=adaptyn-client

      - name: Build server image and publish on main
        uses: *build-push
        with:
          context: ./server
          file: ./server/dockerfile
          target: production
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ steps.registry.outputs.owner }}/adaptyn-server:sha-${{ github.sha }}
          cache-from: type=gha,scope=adaptyn-server
          cache-to: type=gha,mode=max,scope=adaptyn-server
