
name: CI

on:
  push:
  pull_request:

jobs:
  client:
    name: Client Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint

      - name: Test client
        run: npm run test

      - name: Build client
        run: npm run build

  server:
    name: Server Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint server
        run: npm run lint

      - name: Test server
        run: npm run test

      - name: Build server
        run: npm run build

  docker:
    name: Docker Production Builds
    runs-on: ubuntu-latest
    needs: [client, server]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build client Docker image
        run: docker build --target production -t adaptyn-client:ci ./client

      - name: Build server Docker image
        run: docker build --target production -t adaptyn-server:ci ./server
